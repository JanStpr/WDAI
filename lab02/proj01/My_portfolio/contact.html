<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>Portfolio Jana Stąpóra</title>

    <link rel="icon" href="resources/icon.ico" />
    <link rel="stylesheet" href="./style.css" />
    <script src="script.js"></script>
  </head>

  <body>
    <header class="mainHeader">
      <h1>Portfolio Jana Stąpóra</h1>
    </header>

    <nav class="mainNav">
      <a class="navButton" href="index.html">
        <h2>Główna</h2>
      </a>

      <a class="navButton" href="gallery.html">
        <h2>Galeria</h2>
      </a>

      <a class="navButton" href="contact.html" id="currSubSite">
        <h2>Kontakt</h2>
      </a>
    </nav>

    <main id="mainTextBox">
      <section style="width: auto" class="imageBox">
        <h3>Formularz kontaktowy</h3>
        <form action="" , class="contactForm">
          <label for="email" class="formLabel">Adres email nadawcy</label>
          <input
            type="email"
            name="email"
            id="email"
            autocomplete="email"
            required
          />
          <br />

          <label for="messageType" class="formLabel">Temat wiadomości</label>
          <select name="messageType" id="messageType">
            <option value="cowork">Współpraca</option>
            <option value="projectQuery">Zapytanie do projektu</option>
            <option value="other">Inne</option>
          </select>
          <br />

          <label for="mesageBox" class="formLabel">Wiadomość</label>
          <br />
          <textarea name="mesageBox" id="mesageBox" required>
Szanowny Panie,

...

Z poważaniem, ... </textarea
          >

          <button type="submit" id="submitButton">Prześlij</button>
        </form>
      </section>
    </main>
    <footer>
      <p class="pSmall">Data ostatniej modyfikacji: 5.11.2026</p>
      <p class="pSmall">Jan Stąpór</p>
    </footer>
  </body>
</html>
